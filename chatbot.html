<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapLearn - FlashBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="material.css">
  <link rel="stylesheet" href="chatbot.css">
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-marca">
      <img src="logo.PNG" alt="CapLearn" class="sidebar-logo">
      <span class="sidebar-nombre">CapLearn</span>
    </div>

    <nav class="nav">
      <a href="dashboard.html" class="nav-item">
        <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        Inicio
      </a>
      <a href="flashcards.html" class="nav-item">
        <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
        Flashcards
      </a>
      <a href="quiz.html" class="nav-item">
        <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        Quiz
      </a>
      <a href="chatbot.html" class="nav-item activo">
        <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        FlashBot
      </a>
      <a href="material.html" class="nav-item">
        <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Mi Material
      </a>
    </nav>

    <div class="perfil">
      <div class="avatar" id="perfilAvatar">AV</div>
      <div class="perfil-info">
        <p class="perfil-nombre" id="perfilNombre">Ana Valdés</p>
        <p class="perfil-rol">Estudiante</p>
      </div>
      <button type="button" class="perfil-salir" id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="contenido contenido-chat">

    <div class="header">
      <div class="saludo">
        <h1>FlashBot</h1>
        <p>Tu asistente de estudio con IA</p>
      </div>
      <button type="button" class="btn-secundario" id="nuevaConversacionBtn">Nueva conversación</button>
    </div>

    <div class="tarjeta chat-tarjeta">
      <div class="chat-mensajes" id="chatMensajes"></div>

      <div class="chat-escribiendo oculto" id="chatEscribiendo">
        <img src="fllashbot_logo_white.PNG" alt="FlashBot" class="chat-avatar">
        <div class="chat-puntos">
          <span></span><span></span><span></span>
        </div>
      </div>

      <p class="chat-error oculto" id="chatError"></p>

      <form class="chat-input-fila" id="chatForm">
        <input type="text" id="chatInput" placeholder="Escribe tu pregunta..." autocomplete="off">
        <button type="submit" class="btn-primario" id="chatEnviarBtn">Enviar</button>
      </form>
    </div>

  </div>

  <script src="datastore.js"></script>
  <script src="auth-guard.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
